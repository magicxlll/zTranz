[package]
name = "ztranz"
version = "0.1.0"
edition = "2021"
description = "zTranz - translate anything, anywhere (Windows)"

[[bin]]
name = "zTranz"
path = "src/main.rs"

[dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Networking_WinHttp", "Win32_System_Com", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Ole", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Media_Ocr", "Storage"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
